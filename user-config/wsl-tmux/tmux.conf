# 小nao tmux 终端色彩 begin
# tmux 默认 TERM=screen 会让 prompt_toolkit/Rich 在 tmux 下退化到低色彩/反色视频，出现刺眼黄底。
# 新 pane/session 使用 tmux-256color + truecolor；当前已运行的 Hermes 需要重启才能吃到 TERM/COLORTERM。
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"
set-environment -g COLORTERM "truecolor"
# 小nao tmux 终端色彩 end

# 小nao tmux 中文帮助 begin
# Prefix ?：显示中文帮助弹窗；Prefix F1：保留 tmux 原版英文帮助。
bind-key -T prefix ? display-popup -E -w 90% -h 85% "/home/revar/.local/bin/tmux-cn-help"
bind-key -T prefix F1 list-keys -N
# 小nao tmux 中文帮助 end

# 小nao tmux 鼠标模式切换 begin
# Prefix F2 或 Ctrl+g：切换 mouse mode。开=可滚轮/点 pane/拖边框，但右键会进 tmux；关=WT 右键复制粘贴更自然。
bind-key -T prefix F2 set-option -g mouse \; display-message "mouse #{?mouse,on,off}"
bind-key -T root C-g set-option -g mouse \; display-message "mouse #{?mouse,on,off}"
# 小nao tmux 鼠标模式切换 end


# 小nao tmux 鼠标默认行为 begin
# 默认开启 mouse mode；patched tmux 中滚轮在 normal/input 模式走 WT-like viewport，不进 copy-mode；拖选仍走 tmux/clip.exe 桥。
set -g mouse on
# 右键：从 Windows daemon 读取剪贴板并由 tmux paste 到当前 pane；可端到端验证，不依赖前台窗口 SendInput。
bind-key -T root MouseDown3Pane select-pane -t= \; run-shell -b /home/revar/.local/bin/tmux-paste-windows-clipboard
bind-key -T copy-mode MouseDown3Pane select-pane -t= \; send-keys -X cancel \; run-shell -b /home/revar/.local/bin/tmux-paste-windows-clipboard
bind-key -T copy-mode-vi MouseDown3Pane select-pane -t= \; send-keys -X cancel \; run-shell -b /home/revar/.local/bin/tmux-paste-windows-clipboard
# 中键：保留 tmux 原生右键菜单。
bind-key -T root MouseDown2Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" "select-pane -t= ; send -M" "display-menu -t= -xM -yM -T \"#[align=centre]#{pane_index} (#{pane_id})\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}\" < \"send -X history-top\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}\" > \"send -X history-bottom\" '' \"#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}\" C-r \"if -F \\\"#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}\\\" \\\"copy-mode -t=\\\" ; send -Xt= search-backward \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}\" C-y \"copy-mode -q ; send-keys -l -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}\" c \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_line,Copy Line,}\" l \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_line}\\\"\" '' \"Horizontal Split\" h \"split-window -h\" \"Vertical Split\" v \"split-window -v\" '' \"#{?#{>:#{window_panes},1},,-}Swap Up\" u \"swap-pane -U\" \"#{?#{>:#{window_panes},1},,-}Swap Down\" d \"swap-pane -D\" \"#{?pane_marked_set,,-}Swap Marked\" s swap-pane '' Kill X kill-pane Respawn R \"respawn-pane -k\" \"#{?pane_marked,Unmark,Mark}\" m \"select-pane -m\" \"#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}\" z \"resize-pane -Z\""
bind-key -T copy-mode MouseDown2Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" "select-pane -t= ; send -M" "display-menu -t= -xM -yM -T \"#[align=centre]#{pane_index} (#{pane_id})\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}\" < \"send -X history-top\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}\" > \"send -X history-bottom\" '' \"#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}\" C-r \"if -F \\\"#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}\\\" \\\"copy-mode -t=\\\" ; send -Xt= search-backward \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}\" C-y \"copy-mode -q ; send-keys -l -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}\" c \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_line,Copy Line,}\" l \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_line}\\\"\" '' \"Horizontal Split\" h \"split-window -h\" \"Vertical Split\" v \"split-window -v\" '' \"#{?#{>:#{window_panes},1},,-}Swap Up\" u \"swap-pane -U\" \"#{?#{>:#{window_panes},1},,-}Swap Down\" d \"swap-pane -D\" \"#{?pane_marked_set,,-}Swap Marked\" s swap-pane '' Kill X kill-pane Respawn R \"respawn-pane -k\" \"#{?pane_marked,Unmark,Mark}\" m \"select-pane -m\" \"#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}\" z \"resize-pane -Z\""
bind-key -T copy-mode-vi MouseDown2Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" "select-pane -t= ; send -M" "display-menu -t= -xM -yM -T \"#[align=centre]#{pane_index} (#{pane_id})\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}\" < \"send -X history-top\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}\" > \"send -X history-bottom\" '' \"#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}\" C-r \"if -F \\\"#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}\\\" \\\"copy-mode -t=\\\" ; send -Xt= search-backward \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}\" C-y \"copy-mode -q ; send-keys -l -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}\" c \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_line,Copy Line,}\" l \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_line}\\\"\" '' \"Horizontal Split\" h \"split-window -h\" \"Vertical Split\" v \"split-window -v\" '' \"#{?#{>:#{window_panes},1},,-}Swap Up\" u \"swap-pane -U\" \"#{?#{>:#{window_panes},1},,-}Swap Down\" d \"swap-pane -D\" \"#{?pane_marked_set,,-}Swap Marked\" s swap-pane '' Kill X kill-pane Respawn R \"respawn-pane -k\" \"#{?pane_marked,Unmark,Mark}\" m \"select-pane -m\" \"#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}\" z \"resize-pane -Z\""
# 小nao tmux 鼠标默认行为 end

# 小nao tmux copy-mode 视觉清理 begin
# 读取 Windows 鼠标滚轮行数（HKCU WheelScrollLines），缓存给 tmux 滚轮脚本用。
run-shell -b /home/revar/.local/bin/tmux-refresh-wheel-lines
# -H 隐藏 copy-mode 右上角位置指示器。
# tmux 会在 redraw 后重新点亮真实块状 cursor，所以进入/历史区滚动/拖选后延迟再 hide；滚回底部时恢复 cursor。
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" "run-shell -b \"/home/revar/.local/bin/tmux-cursor-hide-delayed #{pane_id}\"" "if -F \"#{>:#{pane_wt_offset},0}\" \"run-shell -b \\\"/home/revar/.local/bin/tmux-cursor-hide-delayed #{pane_id}\\\"\" \"run-shell -b /home/revar/.local/bin/tmux-cursor-show\""'
bind-key -T prefix [ copy-mode -H \; run-shell -b /home/revar/.local/bin/tmux-cursor-hide-delayed
bind-key -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -HM ; run-shell -b /home/revar/.local/bin/tmux-cursor-hide-delayed"
bind-key -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; run-shell -b /home/revar/.local/bin/tmux-cursor-hide-delayed"
bind-key -T copy-mode WheelUpPane select-pane \; run-shell -b "/home/revar/.local/bin/tmux-wheel-up-guarded #{pane_id}"
bind-key -T copy-mode WheelDownPane select-pane \; run-shell -b "/home/revar/.local/bin/tmux-wheel-down-guarded #{pane_id}"
bind-key -T copy-mode-vi WheelUpPane select-pane \; run-shell -b "/home/revar/.local/bin/tmux-wheel-up-guarded #{pane_id}"
bind-key -T copy-mode-vi WheelDownPane select-pane \; run-shell -b "/home/revar/.local/bin/tmux-wheel-down-guarded #{pane_id}"
# 小nao tmux copy-mode 视觉清理 end

# 小nao tmux -> Windows 剪贴板 begin
# 单向桥：tmux copy-mode 复制时写入 Windows clipboard；Windows clipboard -> tmux 仍走 WT 的 Ctrl+V/右键粘贴。
set-option -s copy-command "clip.exe"
# 鼠标拖选复制：拖选结束后复制并退出 copy-mode；历史区通过 patched tmux 回到普通 viewport，不跳底。
# 下一次键盘输入会清掉 viewport、回 live bottom，并恢复 Hermes 光标/刷新。
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
# 小nao tmux -> Windows 剪贴板 end

# 小nao tmux copy-mode 输入直通 begin
# source-file 不会自动删除旧 binding，所以先显式 unbind Any，再按当前策略重建。
unbind-key -T copy-mode Any
unbind-key -T copy-mode-vi Any
# 在 copy-mode 中输入时：退出历史视图、恢复光标，并把输入送回 pane。
# ASCII 显式键走脚本；中文/IME 这类落到 Any 的键走同步 run-shell -C + #{current_key}，避免异步脚本吞多字提交。
bind-key -T copy-mode MouseUp1Pane select-pane
# Alt+V 是 Hermes 的“粘贴剪贴板图片”快捷键；copy-mode 默认把 M-v 当 page-up，必须显式透传给 Hermes。
bind-key -T copy-mode M-v run-shell -b "/home/revar/.local/bin/tmux-copy-mode-send-key \'#{pane_id}\' altv"
bind-key -T copy-mode Any run-shell -C "send-keys -X cancel ; run-shell -b /home/revar/.local/bin/tmux-cursor-show ; send-keys -l '#{current_key}'"
bind-key -T copy-mode a run-shell -b "/home/revar/.local/bin/tmux-copy-mode-send-key '#{pane_id}' key a"
